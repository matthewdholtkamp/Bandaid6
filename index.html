<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BAND-AID 6 — LTC Holtkamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --army-black: #000000;
    --army-gold:  #FFCC01;
    --bg:         #0a0a0a;
    --panel:      #141414;
    --panel-2:    #1c1c1c;
    --text:       #f4f4f4;
    --muted:      #9a9a9a;
    --border:     #2a2a2a;
    --user-bg:    #1f1f1f;
    --bot-bg:     #161616;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  header {
    background: var(--army-black);
    border-bottom: 2px solid var(--army-gold);
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .star { color: var(--army-gold); font-size: 22px; line-height: 1; }
  .title {
    font-family: 'Oswald', sans-serif;
    letter-spacing: 2px; font-weight: 700; font-size: 18px; color: #fff;
  }
  .subtitle {
    font-family: 'Oswald', sans-serif;
    letter-spacing: 3px; font-size: 12px; color: var(--army-gold);
  }
  .reset-link {
    background: transparent; border: none; color: var(--muted);
    font-family: inherit; font-size: 12px; cursor: pointer; padding: 6px 8px;
  }
  .reset-link:hover { color: var(--army-gold); }

  /* App container fills the rest of the viewport */
  .app {
    flex: 1;
    display: flex; flex-direction: column;
    width: 100%;
    max-width: 880px;
    margin: 0 auto;
    padding: 0 16px;
    position: relative;
  }

  /* CENTERED EMPTY STATE — composer floats in the middle until first message */
  .app.empty {
    justify-content: center;
    align-items: stretch;
  }
  .app.empty #chat { display: none; }
  .app.empty .greet { display: block; }
  .app.empty .composer-wrap { position: static; padding: 0; background: none; }
  .app.empty .composer-wrap .footer-note { margin-top: 14px; }

  /* ACTIVE STATE — messages scroll, composer pinned to bottom */
  .app.active #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 4px 24px;
  }
  .app.active .greet { display: none; }
  .app.active .composer-wrap {
    position: sticky;
    bottom: 0;
    padding: 12px 0 18px;
    background: linear-gradient(to top, var(--bg) 75%, transparent);
  }

  .greet { text-align: center; margin-bottom: 24px; }
  .greet h1 {
    font-family: 'Oswald', sans-serif;
    color: var(--army-gold);
    letter-spacing: 4px;
    font-size: 42px;
    margin: 0 0 8px;
  }
  .greet p { color: var(--muted); margin: 0; font-size: 15px; }

  .msg { display: flex; gap: 12px; margin: 18px 0; }
  .avatar {
    flex: 0 0 36px; height: 36px; width: 36px;
    border-radius: 50%;
    background: var(--army-gold);
    color: #000;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .msg.user .avatar { background: #2a2a2a; color: var(--army-gold); }
  .bubble {
    background: var(--bot-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    line-height: 1.55;
    font-size: 15px;
    white-space: pre-wrap;
    max-width: 100%;
  }
  .msg.user .bubble { background: var(--user-bg); }
  .label {
    font-family: 'Oswald', sans-serif;
    font-size: 11px; letter-spacing: 1.5px;
    color: var(--army-gold);
    margin-bottom: 6px;
  }

  /* Composer — big, auto-growing, Claude-style */
  .composer {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 14px 16px 14px 20px;
    display: flex; align-items: flex-end; gap: 12px;
    box-shadow: 0 6px 30px rgba(0,0,0,0.55);
  }
  .composer textarea {
    flex: 1;
    background: transparent;
    border: none; outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 17px;
    line-height: 1.55;
    resize: none;
    min-height: 96px;
    max-height: 40vh;
    padding: 6px 4px;
  }
  .send {
    flex: 0 0 48px; height: 48px; width: 48px;
    border-radius: 50%;
    background: var(--army-gold);
    color: #000;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.08s ease, background 0.12s ease;
  }
  .send:hover { background: #ffd633; }
  .send:active { transform: scale(0.96); }
  .send:disabled { opacity: 0.45; cursor: not-allowed; }
  .send svg { width: 22px; height: 22px; }
  .footer-note {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 8px;
  }
  .typing { color: var(--muted); font-style: italic; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="star">★</span>
    <div>
      <div class="title">BAND-AID 6</div>
      <div class="subtitle">GLWACH ★ MSCoE ★ FORT LEONARD WOOD</div>
    </div>
  </div>
  <button class="reset-link" id="reset" title="Start a new conversation">New conversation</button>
</header>

<div class="app empty" id="app">
  <div class="greet" id="greet">
    <h1>BAND-AID 6</h1>
    <p>Ask LTC Holtkamp a question.</p>
  </div>

  <div id="chat"></div>

  <div class="composer-wrap">
    <div class="composer">
      <textarea id="input" placeholder="Type your question for LTC Holtkamp…" rows="3"></textarea>
      <button class="send" id="send" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
    <div class="footer-note">Persona response — not official medical or command guidance. For medical emergencies call 911.</div>
  </div>
</div>

<script src="config.js"></script>
<script>
const SYSTEM_PROMPT = `You are LTC Matthew Holtkamp — call sign BAND-AID 6 — Deputy Commander for Clinical Services (DCCS) at General Leonard Wood Army Community Hospital (GLWACH) and the Maneuver Support Center of Excellence (MSCoE) Surgeon at Fort Leonard Wood, Missouri.

============================================================
ABSOLUTE RULE — CLINICAL / MEDICAL QUESTIONS
============================================================
You MUST NOT answer any clinical, medical, health, symptom, diagnosis, treatment, medication, or condition question — no matter how casual or general it sounds. This includes definitional questions like "what is a migraine," "is it normal to…," "should I take…," "I have a pain in…," "what should I do about…," vaccine questions, dosage questions, or any first-aid guidance beyond calling for help.

If the user asks ANY such question, your ENTIRE reply must be exactly:

"I can't answer clinical or medical questions here. For medical emergencies, call 911. For non-emergency medical issues at General Leonard Wood Army Community Hospital, please contact the GLWACH duty phone."

Do not add anything else. Do not soften it. Do not give partial information first. Do not say "but generally…" — just the line above, verbatim.

============================================================
WHAT YOU DO ANSWER
============================================================
You answer NON-CLINICAL questions in the voice of LTC Holtkamp: leadership, access to care (the Care Ladder concept — not specific medical advice), quality systems, staff care, command philosophy, how the hospital is organized, mission command, decision-making, leadership development, and personal/professional perspective as a senior Army medical leader.

VOICE & TONE
- First person as LTC Holtkamp. Calm, direct, plainspoken, mission-focused.
- Senior Army medical leader — humble, decisive, accountable.
- Short paragraphs. Lead with the answer, then the reasoning, then the next step.
- BLUF style. Plain English for civilians.

TOP THREE PRIORITIES (the lens for non-clinical answers)
1. ACCESS — the Care Ladder. Right care, right place, right time.
2. QUALITY — safe, evidence-based, consistent systems. Outcomes over optics.
3. STAFF CARE — take care of the team that takes care of the force.

LEADERSHIP STYLE
- Mission command. Intent and left/right limits, then trust the team.
- Walk the floors. Presence is a clinical intervention.
- Truth up and down — bad news first, fast.
- Protect the team from non-mission noise.

LIMITS (in addition to the clinical rule above)
- Do not speak for the Commander; you speak as DCCS and MSCoE Surgeon.
- Respect OPSEC and PII. Do not discuss specific personnel matters.
- If unsure, say so plainly and state how you'd find out.

If the user greets you, greet back briefly and ask what they need help with.`;

const app = document.getElementById("app");
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const resetBtn = document.getElementById("reset");

let history = JSON.parse(localStorage.getItem("bandaid6_history") || "[]");

function save() {
  localStorage.setItem("bandaid6_history", JSON.stringify(history));
}

function setActive(active) {
  app.classList.toggle("active", active);
  app.classList.toggle("empty", !active);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function render() {
  chat.innerHTML = "";
  if (history.length === 0) {
    setActive(false);
    return;
  }
  setActive(true);
  for (const m of history) appendMessage(m.role, m.text);
}

function appendMessage(role, text) {
  setActive(true);
  const wrap = document.createElement("div");
  wrap.className = "msg " + (role === "user" ? "user" : "bot");
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "U" : "★";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = role === "user" ? "YOU" : "BAND-AID 6";
  const body = document.createElement("div");
  body.innerHTML = escapeHtml(text);
  bubble.appendChild(label);
  bubble.appendChild(body);
  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return body;
}

function autoSize() {
  input.style.height = "auto";
  const max = Math.floor(window.innerHeight * 0.4);
  input.style.height = Math.min(input.scrollHeight, max) + "px";
}
input.addEventListener("input", autoSize);
window.addEventListener("resize", autoSize);

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

resetBtn.addEventListener("click", () => {
  if (history.length === 0 || confirm("Start a new conversation?")) {
    history = [];
    save();
    render();
  }
});

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  autoSize();
  history.push({ role: "user", text });
  appendMessage("user", text);
  save();

  sendBtn.disabled = true;
  const botBody = appendMessage("model", "");
  const typing = document.createElement("span");
  typing.className = "typing";
  typing.textContent = "thinking…";
  botBody.appendChild(typing);

  const cfg = window.BANDAID_CONFIG || {};
  const workerUrl = cfg.WORKER_URL;
  const model = cfg.MODEL || "gemini-3.1-flash-lite";
  const fallbackModel = cfg.FALLBACK_MODEL || "gemini-2.5-flash";
  const temperature = typeof cfg.TEMPERATURE === "number" ? cfg.TEMPERATURE : 0.7;
  const thinkingBudget = typeof cfg.THINKING_BUDGET === "number" ? cfg.THINKING_BUDGET : -1;

  if (!workerUrl || workerUrl.includes("CHANGE-ME")) {
    typing.remove();
    botBody.textContent = "Worker URL not configured.";
    sendBtn.disabled = false;
    return;
  }

  const contents = history.map(m => ({
    role: m.role === "user" ? "user" : "model",
    parts: [{ text: m.text }]
  }));

  try {
    const generationConfig = { temperature };
    if (!Number.isNaN(thinkingBudget)) {
      generationConfig.thinkingConfig = { thinkingBudget };
    }
    const res = await fetch(workerUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model,
        fallbackModel,
        systemInstruction: { role: "system", parts: [{ text: SYSTEM_PROMPT }] },
        contents,
        generationConfig
      })
    });
    const data = await res.json();
    typing.remove();
    const reply =
      data?.candidates?.[0]?.content?.parts?.map(p => p.text).join("") ||
      data?.error?.message ||
      "(no response)";
    botBody.textContent = reply;
    history.push({ role: "model", text: reply });
    save();
  } catch (err) {
    typing.remove();
    botBody.textContent = "Network error: " + err.message;
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener("click", send);

render();
autoSize();
</script>
</body>
</html>

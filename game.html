<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 Emoji Memory Match! 🌟</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      background: linear-gradient(135deg, #ff9ff3, #ffeaa7, #74b9ff, #a29bfe);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-size: 2.8em;
      color: white;
      text-shadow: 3px 3px 0px #ff6b6b, 5px 5px 0px rgba(0,0,0,0.2);
      margin-bottom: 10px;
      text-align: center;
      animation: bounce 1s ease infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    .stats {
      display: flex;
      gap: 30px;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.85);
      padding: 12px 30px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .stat {
      text-align: center;
      font-size: 1.1em;
      color: #6c5ce7;
      font-weight: bold;
    }

    .stat span {
      display: block;
      font-size: 1.6em;
      color: #e17055;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      max-width: 420px;
      width: 100%;
    }

    .card {
      aspect-ratio: 1;
      cursor: pointer;
      perspective: 600px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: 16px;
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6em;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    .card-front {
      background: linear-gradient(135deg, #a29bfe, #6c5ce7);
      color: white;
      font-size: 2em;
      border: 3px solid rgba(255,255,255,0.4);
    }

    .card-front::after {
      content: '⭐';
      font-size: 1.2em;
    }

    .card-back {
      background: white;
      transform: rotateY(180deg);
      border: 3px solid #fdcb6e;
    }

    .card.matched .card-back {
      background: linear-gradient(135deg, #55efc4, #00b894);
      animation: matchPulse 0.5s ease;
      border-color: #00b894;
    }

    @keyframes matchPulse {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.15); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    .card:not(.flipped):not(.matched):hover .card-front {
      background: linear-gradient(135deg, #fd79a8, #e84393);
      transform: scale(1.05);
    }

    .btn {
      margin-top: 20px;
      padding: 14px 40px;
      font-size: 1.3em;
      font-family: inherit;
      background: linear-gradient(135deg, #fd79a8, #e17055);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      transition: transform 0.1s, box-shadow 0.1s;
      font-weight: bold;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .win-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 100;
      flex-direction: column;
    }

    .win-screen.show {
      display: flex;
    }

    .win-box {
      background: white;
      border-radius: 30px;
      padding: 40px 50px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.3) rotate(-10deg); opacity: 0; }
      to { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .win-box h2 {
      font-size: 3em;
      color: #e17055;
      margin-bottom: 10px;
    }

    .win-box p {
      font-size: 1.4em;
      color: #6c5ce7;
      margin-bottom: 20px;
    }

    .stars {
      font-size: 3em;
      animation: spin 1s linear infinite;
      display: inline-block;
    }

    .confetti-piece {
      position: fixed;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      animation: confettiFall linear forwards;
      z-index: 99;
    }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    .message {
      font-size: 1.1em;
      color: #6c5ce7;
      margin-top: 8px;
      min-height: 1.5em;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🌟 Memory Match! 🌟</h1>

  <div class="stats">
    <div class="stat">Moves<span id="moves">0</span></div>
    <div class="stat">Matches<span id="matches">0/8</span></div>
    <div class="stat">Time<span id="timer">0s</span></div>
  </div>

  <div class="message" id="message">Tap two cards to match them! 🎉</div>

  <div class="grid" id="grid"></div>

  <button class="btn" onclick="startGame()">🔄 New Game</button>

  <div class="win-screen" id="winScreen">
    <div class="win-box">
      <div class="stars">🌟</div>
      <h2>You Won! 🎊</h2>
      <p id="winMessage">Amazing job!</p>
      <button class="btn" onclick="closeWin()">Play Again! 🎮</button>
    </div>
  </div>

  <script>
    const EMOJIS = ['🐱','🐶','🦊','🐸','🦋','🌸','🦄','🍕','🌈','🎈','🍦','⭐','🐧','🐠','🎀','🍓'];
    const MESSAGES = [
      "Great try! Keep going! 💪",
      "You're doing amazing! 🌟",
      "So close! You've got this! 🎯",
      "Wow, you're a memory star! ⭐",
      "Keep it up, superstar! 🚀",
    ];

    let flipped = [], matched = 0, moves = 0, canFlip = true;
    let timerInterval, startTime, gameStarted = false;

    function shuffle(arr) {
      return [...arr].sort(() => Math.random() - 0.5);
    }

    function startGame() {
      clearInterval(timerInterval);
      flipped = []; matched = 0; moves = 0; canFlip = true; gameStarted = false;
      document.getElementById('moves').textContent = '0';
      document.getElementById('matches').textContent = '0/8';
      document.getElementById('timer').textContent = '0s';
      document.getElementById('message').textContent = 'Tap two cards to match them! 🎉';
      document.getElementById('winScreen').classList.remove('show');

      const chosen = shuffle(EMOJIS).slice(0, 8);
      const pairs = shuffle([...chosen, ...chosen]);

      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      pairs.forEach((emoji, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.emoji = emoji;
        card.dataset.index = i;
        card.innerHTML = `
          <div class="card-inner">
            <div class="card-front"></div>
            <div class="card-back">${emoji}</div>
          </div>`;
        card.addEventListener('click', () => flipCard(card));
        grid.appendChild(card);
      });
    }

    function flipCard(card) {
      if (!canFlip) return;
      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
      if (flipped.length >= 2) return;

      if (!gameStarted) {
        gameStarted = true;
        startTime = Date.now();
        timerInterval = setInterval(() => {
          document.getElementById('timer').textContent =
            Math.floor((Date.now() - startTime) / 1000) + 's';
        }, 500);
      }

      card.classList.add('flipped');
      flipped.push(card);

      if (flipped.length === 2) {
        moves++;
        document.getElementById('moves').textContent = moves;
        canFlip = false;

        if (flipped[0].dataset.emoji === flipped[1].dataset.emoji) {
          flipped[0].classList.add('matched');
          flipped[1].classList.add('matched');
          matched++;
          document.getElementById('matches').textContent = `${matched}/8`;
          document.getElementById('message').textContent =
            matched < 8 ? MESSAGES[Math.floor(Math.random() * MESSAGES.length)] : '';
          flipped = [];
          canFlip = true;

          if (matched === 8) {
            clearInterval(timerInterval);
            const secs = Math.floor((Date.now() - startTime) / 1000);
            setTimeout(() => showWin(moves, secs), 500);
          }
        } else {
          document.getElementById('message').textContent = 'Not quite! Try again! 😊';
          setTimeout(() => {
            flipped[0].classList.remove('flipped');
            flipped[1].classList.remove('flipped');
            flipped = [];
            canFlip = true;
            document.getElementById('message').textContent = 'Keep going! You can do it! 💫';
          }, 900);
        }
      }
    }

    function showWin(moves, secs) {
      launchConfetti();
      let msg = '';
      if (moves <= 12) msg = `PERFECT! Only ${moves} moves in ${secs} seconds! You're a genius! 🧠`;
      else if (moves <= 18) msg = `Awesome! ${moves} moves in ${secs} seconds! Super smart! 🌟`;
      else msg = `You did it! ${moves} moves in ${secs} seconds! You're a champion! 🏆`;
      document.getElementById('winMessage').textContent = msg;
      document.getElementById('winScreen').classList.add('show');
    }

    function closeWin() {
      document.getElementById('winScreen').classList.remove('show');
      startGame();
    }

    function launchConfetti() {
      const colors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#00d2d3','#ff9f43'];
      for (let i = 0; i < 80; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.top = '-20px';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        piece.style.animationDelay = (Math.random() * 0.8) + 's';
        document.body.appendChild(piece);
        piece.addEventListener('animationend', () => piece.remove());
      }
    }

    startGame();
  </script>
</body>
</html>
